<!DOCTYPE html>
<html lang="de">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>fingerspell</title>
		<style>
			.mirror {
				transform: scaleX(-1);
			}
		</style>
	</head>
	<body>
		<h1>fingerspell</h1>
		<video class="mirror" id="camera" autoplay playsinline muted>
		</video>
		<canvas id="frame" style="display: none"></canvas>
		<script>
			const video = document.getElementById("camera");
			const canvas = document.getElementById("frame");
			const ctx = canvas.getContext("2d");
			const ws = new WebSocket(`wss://${location.host}/ws`);
			async function startCamera() {
				const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
				video.srcObject = stream;
			}

			function sendFrame() {
				// cam not ready, or the last frame is still on its way
				if (video.videoWidth === 0 || ws.bufferedAmount > 0) return;
				
				canvas.width = video.videoWidth;
				canvas.height = video.videoHeight;
				ctx.drawImage(video, 0, 0);
				canvas.toBlob((blob) => ws.send(blob), "image/jpeg", 0.7);
			}

			ws.onopen = () => setInterval(sendFrame, 200);
			startCamera();
		</script>
	</body>
</html>
